<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Framework</title>

    <!-- CDN BOOTSTRAP 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>
    <!-- 
    navbar : merupakan kelas yang dapat digunakan untuk membuat navigasi bar
    navbar-expand-lg : untuk mengatur navbar agar dapat diperluas pada layar besar
    navbar-light : untuk memberikan tema warna terang pada navbar
    bg-light : untuk memberikan latar belakang terang pada navbar
    -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <!-- container-fluid : untuk membuat kontainer yang mengisi seluruh lebar layar -->
        <div class="container-fluid">
            <!-- navbar-brand : untuk menampilkan nama atau logo dari website -->
            <a class="navbar-brand" href="#">Navbar</a>
            <!-- navbar-toggler : untuk membuat tombol yang dapat digunakan untuk mengubah tampilan navbar pada layar kecil (humberger menu)-->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <!-- collapse navbar-collapse : untuk mengatur elemen-elemen di dalam navbar agar dapat disembunyikan pada layar kecil -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- navbar-nav : untuk membuat daftar navigasi di dalam navbar -->
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Features</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Pricing</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" href="#" tabindex="-1" aria-disabled="true">Disabled</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>

</html>
